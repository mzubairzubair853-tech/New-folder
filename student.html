<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student - My Attendance</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Meme Loader - Dancing Cat -->
<div id="refreshLoader">
  <img src="https://media.giphy.com/media/vFKqnCdLPNOKc/giphy.gif" alt="Funny Cat Meme">
  <h2>Refreshing... 😹</h2>
  <p>Please wait, attendance is loading...</p>
  <div class="loader-dots">● ● ●</div>
</div>

<!-- Toast Message - Instead of Alert -->
<div id="toast"></div>

<div class="header student-header">
  <div style="font-size:50px">🎓</div>
  <h2 id="studentNameTop">Student Name</h2>
  <p>BSIT Student</p>
  <p id="studentRollTop"></p>
</div>

<div class="card" style="text-align:center">
  <h3>Overall Attendance</h3>
  <div class="circle"><h1 id="percentText">0%</h1><span>Attendance</span></div>
  <div class="progress-bg"><div id="progressBar" class="progress-fill" style="width:0%"></div></div>
  <p id="attStatus" style="font-weight:bold; font-size:18px"></p>
  <p id="examWarning" style="background:#fff3cd; padding:12px; border-radius:12px; font-weight:bold; color:#856404; margin:10px 0;">⚠️ Note: If your attendance is below 75%, you will NOT be allowed to sit in Exams!</p>
  <div class="row"><span>Total Lectures</span><b id="totalLec">0</b></div>
  <div class="row"><span>Present</span><b id="presentLec" style="color:green">0</b></div>
  <div class="row"><span>Absent</span><b id="absentLec" style="color:red">0</b></div>
  <div class="row"><span>Today's Attendance</span><b id="todayAtt">-</b></div>
</div>

<div class="card">
  <h3>📚 Subject Wise Attendance</h3>
  <div id="subjectList"></div>
  <button class="btn-refresh" onclick="refreshStudent()">🔄 Refresh - See New Attendance</button>
  <button class="btn-back" onclick="goHome()">🏠 Logout</button>
</div>
<script src="js/app.js"></script>
<script>loadStudentPage();</script>
</body>
</html>
